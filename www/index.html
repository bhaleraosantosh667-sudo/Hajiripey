

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaazriPay</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f3f5f7; }
    h1 { color: #164e63; }
    .card { background: white; padding: 16px; border-radius: 12px; margin: 12px 0; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 6px 0; }
    button { background: #087f8c; color: white; border: 0; border-radius: 8px; }
    .lang { width: auto; background: #164e63; }
  </style>
</head>
<body>
  <button class="lang" onclick="setLang('mr')">मराठी</button>
  <button class="lang" onclick="setLang('en')">English</button>
  <h1 id="title">HaazriPay</h1>
  <p id="subtitle">Attendance & Salary Manager</p>

  <div class="card">
    <h3 id="heading">Employee Management</h3>
    <input id="name" placeholder="Employee name">
    <input id="salary" type="number" placeholder="Daily salary ₹">
    <button id="add" onclick="addEmployee()">Add Employee</button>
  </div>
  <div class="card">
    <h3 id="listTitle">Employee List</h3>
    <ul id="employees"></ul>
  </div>

  <script>
    let lang = 'en';
    function setLang(value) {
      lang = value;
      document.documentElement.lang = lang;
      document.getElementById('subtitle').textContent =
        lang === 'mr' ? 'हजेरी आणि पगार व्यवस्थापन' : 'Attendance & Salary Manager';
      document.getElementById('heading').textContent =
        lang === 'mr' ? 'कर्मचारी व्यवस्थापन' : 'Employee Management';
      document.getElementById('name').placeholder =
        lang === 'mr' ? 'कर्मचाऱ्याचे नाव' : 'Employee name';
      document.getElementById('salary').placeholder =
        lang === 'mr' ? 'दैनिक पगार ₹' : 'Daily salary ₹';
      document.getElementById('add').textContent =
        lang === 'mr' ? 'कर्मचारी जोडा' : 'Add Employee';
      document.getElementById('listTitle').textContent =
        lang === 'mr' ? 'कर्मचारी यादी' : 'Employee List';
    }
    function addEmployee() {
      const name = document.getElementById('name').value.trim();
      const salary = document.getElementById('salary').value;
      if (!name || salary === '' || Number(salary) < 0) {
        alert(lang === 'mr' ? 'नाव आणि योग्य पगार भरा.' : 'Enter a name and valid salary.');
        return;
      }
      const li = document.createElement('li');
      li.textContent = name + ' — ₹' + Number(salary) +
        (lang === 'mr' ? ' प्रतिदिन' : ' per day');
      document.getElementById('employees').appendChild(li);
      document.getElementById('name').value = '';
      document.getElementById('salary').value = '';
    }
  </script>
</body>
</html>
